<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">A little progress, every day</p>
        <h1>My To-Do List</h1>
        <p class="intro">Add a task, then check it off when it’s done.</p>
      </header>

      <form id="task-form" class="task-form">
        <div class="task-field task-field--title">
          <label for="task-input">Task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What needs doing?"
            maxlength="200"
            required
          >
        </div>
        <div class="task-field">
          <label for="due-date-input">Due date (optional)</label>
          <input id="due-date-input" name="dueDate" type="date">
        </div>
        <button type="submit">Add task</button>
      </form>

      <section class="task-section" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <p id="empty-message" class="empty-message">No tasks yet. Add one above to get started.</p>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>

      <p class="save-note">Your tasks are saved in this browser.</p>
    </main>
  </body>
</html>
